name: Build My Melon APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract My Melon project
        run: |
          mkdir extracted
          unzip -q *.zip -d extracted

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find extracted -name settings.gradle.kts -type f -exec dirname {} \; | head -1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found at $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Java and Kotlin
        run: |
          cd "$PROJECT_DIR"

          sed -i '/val ec = when {/,/^        }/d' \
            app/src/main/java/com/melonfarm/planner/MainActivity.kt

          cat >> app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          EOF

      - name: Build My Melon
        run: |
          cd "$PROJECT_DIR"
          gradle clean assembleDebug

      - name: Check APK
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "APK was not generated"
            exit 1
          fi

          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload My Melon APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Melon-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
